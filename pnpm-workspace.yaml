packages:
  - "apps/*"
  - "!apps/example" # self-contained demo monorepo with its own workspace; run it on its own
  - "packages/*"
allowBuilds:
  '@clerk/shared': true
  esbuild: true
  sharp: true

# Latest Starlight still depends on postcss-nested 6, which pulls
# postcss-selector-parser 6 (GHSA-rj75-hqrm-r3gf, fixed in 7.1.6).
# postcss-nested 8 is the current release and depends on parser ^7.1.4.
overrides:
  postcss-nested: 8.0.1
